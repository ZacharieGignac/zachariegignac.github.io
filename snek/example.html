<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snek Background</title>
  <link rel="stylesheet" href="snek.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f1429;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .github-link {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: rgba(103, 203, 255, 0.1);
      border: 1px solid rgba(103, 203, 255, 0.3);
      border-radius: 8px;
      color: #67cbff;
      text-decoration: none;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .github-link:hover {
      background: rgba(103, 203, 255, 0.2);
      border-color: rgba(103, 203, 255, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <canvas data-snek 
          data-snek-count="10" 
          data-snek-colors="103, 203, 255; 93, 240, 206; 170, 152, 255; 255, 180, 100; 255, 100, 150; 255, 230, 109; 100, 255, 150; 255, 120, 120; 150, 200, 255; 200, 150, 255"
          aria-hidden="true"></canvas>
  
  <a href="https://github.com/ZacharieGignac/snek" class="github-link" target="_blank" rel="noopener noreferrer">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    View on GitHub
  </a>

  <script src="snek.js"></script>
  <script>
    // Manual initialization to ensure it works
    const canvas = document.querySelector('[data-snek]');
    if (canvas) {
      new SnekBackground(canvas, {
        snakeCount: 10,
        colors: [
          '103, 203, 255',  // Cyan
          '93, 240, 206',   // Mint
          '170, 152, 255',  // Purple
          '255, 180, 100',  // Orange
          '255, 100, 150',  // Pink
          '255, 230, 109',  // Yellow
          '100, 255, 150',  // Green
          '255, 120, 120',  // Red
          '150, 200, 255',  // Light Blue
          '200, 150, 255'   // Lavender
        ]
      });
    }
  </script>
</body>
</html>
